name: deploy-project-page

on:
  push:
    branches:
      - main
      - codex/project-site-method-figure
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "scripts/build_project_site.py"
      - "papers/beyond-proximity/main.pdf"
      - "papers/beyond-proximity/figures/**"
      - "papers/twinworld/figures/fig_agent_mcp_workflow.png"
      - "papers/twinworld/figures/fig_five_scene_summary.png"
      - "papers/twinworld/figures/fig_instruction_agent.png"
      - "papers/twinworld/figures/fig_raw_rgbd_hierarchy.png"
      - "papers/twinworld/figures/fig_hierarchy_construction_variants.png"
      - "docs/reports/final/graph_construction_cost.json"
      - "docs/experiments/hierarchy_construction/four_variant_v1/hierarchy_evaluation.json"
      - "docs/experiments/public_datasets/phase6_7_v3/**"
      - "outputs/graph_vs_flat/five_scene_graph_vs_flat_v2/metrics_summary.json"
      - "outputs/agent_semantic/five_scene_four_variant_v1/metrics_summary.json"
      - "outputs/instruction_agent/five_scene_qwen25_05b_graph_v1/metrics_summary.json"
      - "outputs/raw_rgbd_hierarchy/five_scene_clip_v1/metrics_summary.json"
      - "backend/data/scenes/ConferenceHall-capture-pilot/images/v018.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Pull required LFS asset only
        run: git lfs pull --include="backend/data/scenes/ConferenceHall-capture-pilot/images/v018.png"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build static research site
        run: python -B scripts/build_project_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
