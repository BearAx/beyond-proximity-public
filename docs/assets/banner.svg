<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SemanticSplat banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="120" fill="#4ade80" opacity="0.06"/>
  <circle cx="150" cy="260" r="90" fill="#22d3ee" opacity="0.05"/>
  <!-- abstract tree / splat motif -->
  <g opacity="0.35" stroke="#4ade80" stroke-width="1.5" fill="none">
    <path d="M920 240 L980 120 L1040 240"/>
    <path d="M960 180 L980 120 L1000 180"/>
    <circle cx="980" cy="120" r="6" fill="#4ade80" stroke="none"/>
    <circle cx="920" cy="240" r="4" fill="#22d3ee" stroke="none"/>
    <circle cx="1040" cy="240" r="4" fill="#22d3ee" stroke="none"/>
  </g>
  <g opacity="0.25">
    <ellipse cx="1040" cy="200" rx="28" ry="18" fill="#4ade80"/>
    <ellipse cx="1065" cy="210" rx="22" ry="14" fill="#22d3ee"/>
    <ellipse cx="1015" cy="215" rx="20" ry="12" fill="#86efac"/>
  </g>
  <text x="72" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">SemanticSplat</text>
  <text x="74" y="162" fill="url(#accent)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Language-Grounded Navigation over 3D Gaussian Splats</text>
  <text x="74" y="210" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Semantic tree traversal · Graph-pruned VLM search · Interactive browser demo</text>
  <rect x="74" y="238" width="210" height="36" rx="18" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="98" y="262" fill="#bbf7d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">4.1× faster · 8.5× fewer tokens</text>
</svg>
