<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#g)"/>
  <circle cx="1100" cy="120" r="180" fill="url(#pulse)">
    <animate attributeName="r" values="160;200;160" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="290" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="78" font-weight="700">SemanticSplat</text>
  <text x="84" y="370" fill="#4ade80" font-family="system-ui,sans-serif" font-size="36">3DGS · Semantic Trees · Graph Search</text>
  <text x="84" y="440" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="26">github.com/LeoPython2006/beyond-proximity</text>
</svg>
